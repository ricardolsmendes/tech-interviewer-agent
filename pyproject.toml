[project]
name = "tech-interviewer-agent"
version = "0.1.0"
description = "CrewAI-based assistant for tech interviewers: skill listings, resume assessments, candidate comparisons, interview questions, and post-interview summaries."
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.98",
    "pypdf>=5.1",
    "jinja2>=3.1",
    "typer>=0.15",
    "python-dotenv>=1.0",
]

[project.scripts]
interviewer = "interviewer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff.lint]
# B008: typer's documented pattern is `= typer.Option(...)` as the argument default.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewer"]
